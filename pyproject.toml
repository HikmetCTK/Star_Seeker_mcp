[project]
name = "star-seeker-mcp"
version = "0.2.0"
description = "MCP server that turns a GitHub user's starred repositories into a searchable hybrid (BM25 + Gemini embedding) knowledge base"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["mcp", "github", "search", "bm25", "embeddings", "rag"]
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=2.14.1",
    "google-genai>=2.8.0",
    "numpy>=2.4.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
]

[project.scripts]
star-seeker-mcp = "server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The project ships flat top-level modules rather than an importable package.
include = ["*.py"]

[dependency-groups]
dev = [
    "gradio>=4.0.0",
    "pytest>=8.3.0",
]

